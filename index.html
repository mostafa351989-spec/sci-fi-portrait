<title>Luxury Sci-Fi Portrait</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #001a1a;
  overflow: hidden;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, -apple-system, sans-serif;
}
.hex-pattern {
  position: fixed;
  width: 100%;
  height: 100%;
  background-image: 
    repeating-linear-gradient(60deg, #003333 0px, #003333 1px, transparent 1px, transparent 60px),
    repeating-linear-gradient(-60deg, #003333 0px, #003333 1px, transparent 1px, transparent 60px);
  opacity: 0.2;
  animation: drift 30s linear infinite;
}
@keyframes drift { 0% { transform: translateY(0); } 100% { transform: translateY(60px); } }
.container {
  position: relative;
  width: 400px;
  height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.photo {
  width: 300px;
  height: 300px;
  clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
  opacity: 0.35;
  object-fit: cover;
  position: relative;
  z-index: 10;
  border: 3px solid #00d4aa;
  box-shadow: 0 0 30px #00d4aa, inset 0 0 0 2px #ff6600;
}
.ring {
  position: absolute;
  border-radius: 50%;
  will-change: transform;
}
.ring1 {
  width: 380px;
  height: 380px;
  border: 3px dashed #00d4aa;
  animation: rotate 15s linear infinite;
  box-shadow: 0 0 20px #00d4aa;
}
.ring2 {
  width: 420px;
  height: 420px;
  border: 3px solid #00d4aa;
  border-right-color: #ff6600;
  border-left-color: #ff6600;
  animation: rotate 10s linear infinite reverse;
  box-shadow: 0 0 25px #00d4aa;
}
.ring3 {
  width: 460px;
  height: 460px;
  border: 2px solid #ff6600;
  animation: rotate 6s linear infinite;
  box-shadow: 0 0 15px #ff6600;
}
@keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.data-column {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 60%;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.data-column.left { left: 5%; }
.data-column.right { right: 5%; }
.data-bar {
  width: 100%;
  background: #00d4aa;
  animation: fill 2s ease-in-out infinite;
  box-shadow: 0 0 8px #00d4aa;
}
.data-bar.orange { background: #ff6600; box-shadow: 0 0 8px #ff6600; }
@keyframes fill { 0%, 100% { height: 10%; } 50% { height: 90%; } }
.corner {
  position: fixed;
  width: 60px;
  height: 60px;
  border: 3px solid #00d4aa;
}
.corner::after {
  content: '';
  position: absolute;
  width: 15px;
  height: 15px;
  background: #ff6600;
  box-shadow: 0 0 10px #ff6600;
}
.top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
.top-left::after { top: -3px; left: -3px; }
.top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
.top-right::after { top: -3px; right: -3px; }
.bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
.bottom-left::after { bottom: -3px; left: -3px; }
.bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }
.bottom-right::after { bottom: -3px; right: -3px; }
.scan {
  position: fixed;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00d4aa, #ff6600, #00d4aa, transparent);
  box-shadow: 0 0 20px #00d4aa;
  animation: scan 8s linear infinite;
}
@keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
</style>
</head>
