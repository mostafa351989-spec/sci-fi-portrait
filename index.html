<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose Nebula Portrait</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#000;
  overflow:hidden;
  font-family:'Orbitron',sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
/* نجوم متلألئة */
.stars{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
.star{
  position:absolute;
  background:#fff;
  border-radius:50%;
  animation:twinkle 3s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.3; transform:scale(1)}
  50%{opacity:1; transform:scale(1.5)}
}
/* قمر هلال هولوغرام */
.moon{
  position:absolute;
  top:8%;
  right:10%;
  width:90px;
  height:90px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #fff, #c77dff 40%, #7b2ff7 70%, transparent 75%);
  box-shadow:0 0 50px #c77dff, 0 0 100px #7b2ff7, inset 0 0 30px rgba(199,125,255,0.5);
  animation:moonGlow 4s ease-in-out infinite;
}
.moon::before{
  content:'';
  position:absolute;
  top:0;
  left:-25px;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#000;
  filter:blur(1px);
}
@keyframes moonGlow{
  0%,100%{box-shadow:0 50px #c77dff, 0 100px #7b2ff7; transform:scale(1)}
  50%{box-shadow:0 0 80px #e0aaff, 0 0 150px #9d4edd; transform:scale(1.05)}
}
/* الحاوية الرئيسية */
.container{
  position:relative;
  width:400px;
  height:400px;
}
/* الصورة */
.portrait{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:250px;
  height:250px;
  border-radius:50%;
  overflow:hidden;
  z-index:10;
  border:3px solid rgba(255,20,147,0.8);
  box-shadow:0 40px rgba(255,20,147,0.9), 
             0 0 80px rgba(138,43,226,0.7),
             inset 0 0 40px rgba(255,20,147,0.4);
  animation:pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow{
  0%,100%{box-shadow:0 40px rgba(255,20,147,0.9), 0 0 80px rgba(138,43,226,0.7)}
 50%{box-shadow:0 0 60px rgba(255,105,180,1), 0 0 120px rgba(186,85,211,0.9)}
}
.portrait img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(1.15) contrast(1.15) saturate(1.2);
}
/* حلقات ورد وقلوب هولوغرام */
.ring{
  position:absolute;
  top:50%;
  left:50%;
  border-radius:50%;
  border:2px dashed;
  transform:translate(-50%,-50%);
}
.ring1{
  width:320px;
  height:320px;
  border-color:rgba(255,20,147,0.9);
  animation:spin 18s linear infinite;
  box-shadow:0 0 30px rgba(255,20,147,0.6), inset 0 0 20px rgba(255,20,147,0.3);
}
.ring2{
  width:360px;
  height:360px;
  border-color:rgba(186,85,211,0.9);
  animation:spin 14s linear infinite reverse;
  box-shadow:0 0 30px rgba(186,85,211,0.6), inset 0 0 20px rgba(186,85,211,0.3);
}
/* ورد وقلوب بتلف */
.orb{
  position:absolute;
  font-size:28px;
  animation:orbit 12s linear infinite;
  filter:drop-shadow(0 0 12px currentColor);
}
.orb1{top:0; left:50%; color:#ff1493; animation-delay:0s}
.orb2{top:50%; right:0; color:#ff69b4; animation-delay:-3s}
.orb3{bottom:0; left:50%; color:#da70d6; animation-delay:-6s}
.orb4{top:50%; left:0; color:#ff1493; animation-delay:-9s}
@keyframes spin{
  from{transform:translate(-50%,-50%) rotate(0deg)}
  to{transform:translate(-50%,-50%) rotate(360deg)}
}
@keyframes orbit{
  0%{transform:rotate(0deg) translateX(180px) rotate(0deg) scale(1)}
  50%{transform:rotate(180deg) translateX(180px) rotate(-180deg) scale(1.2)}
  100%{transform:rotate(360deg) translateX(180px) rotate(-360deg) scale(1)}
}
/* وردتين كبار تحت - شيلنا الشجر */
.roses{
  position:absolute;
  bottom:3%;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:80px;
  z-index:5;
}
.rose{
  font-size:80px;
  animation:roseFloat 3.5s ease-in-out infinite;
  filter:drop-shadow(0 0 25px #ff1493) drop-shadow(0 0 40px #8a2be2);
}
.rose:nth-child(1){animation-delay:0s}
.rose:nth-child(2){
  animation-delay:1.8s;
  transform:scaleX(-1);
}
@keyframes roseFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-20px) scale(1.1)}
}
/* قلوب هولوغرام طايرة */
.floating-hearts{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}
.heart{
  position:absolute;
  font-size:22px;
  color:#ff69b4;
  opacity:0.8;
  animation:float 7s ease-in-out infinite;
  filter:drop-shadow(0 0 8px currentColor);
}
@keyframes float{
  0%{transform:translateY(100vh) scale(0) rotate(0deg); opacity:0}
  20%{opacity:0.9}
  80%{opacity:0.9}
  100%{transform:translateY(-100vh) scale(1.3) rotate(360deg); opacity:0}
}
</style>
</head>
