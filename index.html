<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Rose Nebula</title><style>@import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap");*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:"Orbitron",sans-serif;height:100vh;display:flex;align-items:center;justify-content:center}.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s infinite}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(2);box-shadow:0 0 10px #fff}}.moon{position:absolute;top:8%;right:10%;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#c77dff 40%,#7b2ff7 70%,transparent 75%);box-shadow:0 0 50px #c77dff,0 0 120px #7b2ff7,inset 0 0 35px rgba(199,125,255,.6);animation:moonGlow 4s ease-in-out infinite;z-index:3}.moon::before{content:"";position:absolute;top:0;left:-25px;width:90px;height:90px;border-radius:50%;background:#000;filter:blur(1px)}@keyframes moonGlow{0%,100%{box-shadow:0 0 50px #c77dff,0 0 120px #7b2ff7;transform:scale(1)}50%{box-shadow:0 0 90px #e0aaff,0 0 180px #9d4edd;transform:scale(1.08)}}.container{position:relative;width:400px;height:400px;z-index:5}.portrait{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:250px;height:250px;border-radius:50%;overflow:hidden;z-index:10;border:3px solid rgba(255,20,147,.9);box-shadow:0 0 40px rgba(255,20,147,1),0 0 80px rgba(138,43,226,.8),inset 0 0 40px rgba(255,20,147,.5);animation:pulseGlow 3s ease-in-out infinite}@keyframes pulseGlow{0%,100%{box-shadow:0 0 40px rgba(255,20,147,1),0 0 80px rgba(138,43,226,.8)}50%{box-shadow:0 0 70px rgba(255,105,180,1),0 0 140px rgba(186,85,211,1)}}.portrait img{width:100%;height:100%;object-fit:cover;filter:brightness(1.2) contrast(1.15) saturate(1.3)}.ring{position:absolute;top:50%;left:50%;border-radius:50%;border:2px dashed;transform:translate(-50%,-50%)}.ring1{width:320px;height:320px;border-color:rgba(255,20,147,1);animation:spin 18s linear infinite;box-shadow:0 0 35px rgba(255,20,147,.7),inset 0 0 25px rgba(255,20,147,.4)}.ring2{width:360px;height:360px;border-color:rgba(186,85,211,1);animation:spin 14s linear infinite reverse;box-shadow:0 0 35px rgba(186,85,211,.7),inset 0 0 25px rgba(186,85,211,.4)}.orb{position:absolute;font-size:30px;animation:orbit 12s linear infinite;filter:drop-shadow(0 0 15px currentColor)}.orb1{top:0;left:50%;color:#ff1493;animation-delay:0s}.orb2{top:50%;right:0;color:#ff69b4;animation-delay:-3s}.orb3{bottom:0;left:50%;color:#da70d6;animation-delay:-6s}.orb4{top:50%;left:0;color:#ff1493;animation-delay:-9s}@keyframes spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes orbit{0%{transform:rotate(0deg) translateX(180px) rotate(0deg) scale(1)}50%{transform:rotate(180deg) translateX(180px) rotate(-180deg) scale(1.3)}100%{transform:rotate(360deg) translateX(180px) rotate(-360deg) scale(1)}}.roses{position:fixed;bottom:3%;left:50%;transform:translateX(-50%);display:flex;gap:90px;z-index:5}.rose{font-size:85px;animation:roseFloat 3.5s ease-in-out infinite;filter:drop-shadow(0 0 30px #ff1493) drop-shadow(0 0 50px #8a2be2)}.rose:nth-child(1){animation-delay:0s}.rose:nth-child(2){animation-delay:1.8s;transform:scaleX(-1)}@keyframes roseFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-25px) scale(1.15)}}</style></head><body><div class="stars" id="stars"></div><div class="moon"></div><div class="container"><div class="ring ring1"></div><div class="ring ring2"></div><div class="orb orb1">🌹</div><div class="orb orb2">💜</div><div class="orb orb3">🌹</div><div class="orb orb4">💖</div><div class="portrait"><img src="data:image/jpeg;base64,iVBORw0KGgoAAAANSUhEUgAAAKEAAABRAQMAAACADVTsAAAABlBMVEUiIiL///9ehyAxAAABrElE QVR4Xu3QL2/bQBgG8NdRlrnMNqxu1eVAahCQVAEF03STbsuBSFVZYEBBoJ2RjZ0Hljuy6IZaUlUl pfsKRUmZP4JTNJixkEm7nJu/Mxlot0l7JJOfXj06P/D3xvkBQH/lqoEC7WVvzqM0k/f4+Gat2nt7 ppqeCjCbiJX6HmN7vnca4LLc0BljH/yZ0ZejDQXGlA9GmYSthoumVw1wZ6PByxjrpxmeZq0hbMcD XPCHGVB4hHCAkgUKrrNSulawelPRCH37mu4fR1EdZYPwnTA6UZoQfteoMSmPCFVcgYmUmmCuPMKk IAtNFjqS+hWyOo+MzmVsb12NS1aFazThe1Ztr2qYBklWvcPKCKG+TA/MGwjqDcI4n1Pko+1E5KM9 TRz75fGB0qWv1Vlq/Bo9Gzqo3oqu7g991G1bVQmp8IQcdeRtEGpyxoVVB5eNLob0qS6xpaJc5+J7 Wx+wkwct5SoSn2vCOORKrHZk0lC69tAbm4a2g0grEuknvd9tb61XhqK8hz+d/xG/cft5fD0dvxA7 qsLrj+EXWqBugRbeHl6qcbCr4Ba+7Tn88/kJk4CIztd1IrIAAAAASUVORK5CYII="></div></div><div class="roses"><div class="rose">🌹</div><div class="rose">🌹</div></div><script>const s=document.getElementById("stars");for(let i=0;i<100;i++){const d=document.createElement("div");d.className="star";d.style.left=Math.random()*100+"%";d.style.top=Math.random()*100+"%";d.style.width=d.style.height=Math.random()*3+1+"px";d.style.animationDelay=Math.random()*3+"s";s.appendChild(d)}</script></body></html>
